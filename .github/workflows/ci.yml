name: CI

'on':
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  # The ruleset on main requires this job by name: keep it called `check`.
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # change guards diff the branch against main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: "${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}"
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Lint
        run: npm run lint

      - name: Unused files, exports and dependencies
        run: npm run knip

      - name: Change guards (weakened tests, suppressions, PR size)
        run: npm run guards

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test (with coverage report)
        run: npm run test:coverage

      - name: Codegen drift check
        run: |
          npm run codegen
          git diff --exit-code lib/graphql/__generated__/types.ts

      - name: Build
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to Render (production)
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}"

  lighthouse:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for Render deployment
        run: |
          echo "Waiting for Render to finish deploying..."
          sleep 180
          for i in $(seq 1 10); do
            status=$(curl -o /dev/null -s -w "%{http_code}" https://crashmap.io)
            if [ "$status" = "200" ]; then
              echo "Site returned 200"
              exit 0
            fi
            echo "Attempt $i: HTTP $status — waiting 30s..."
            sleep 30
          done
          echo "Site did not return 200 after 5 minutes post-sleep; running Lighthouse anyway"

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  # Post-deploy smoke test against crashmap.io; a failure fails the main run,
  # which GitHub emails about. Runs after Lighthouse, which already waited for
  # the deploy, even if Lighthouse itself failed. That wait only checks for
  # HTTP 200, so a slow Render deploy can mean this tests the previous build.
  smoke:
    needs: [deploy, lighthouse]
    runs-on: ubuntu-latest
    if: !cancelled() && needs.deploy.result == 'success'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test crashmap.io
        run: npm run smoke

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-traces
          path: test-results/
          retention-days: 14
