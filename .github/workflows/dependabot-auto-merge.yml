name: dependabot-auto-merge

# Turns on auto-merge for Dependabot PRs that only bump devDependencies by a
# patch version (the dev-patch group). The ruleset's required `check` job
# still has to pass before GitHub merges. Everything else waits for Nick
# (clankers standards/git.md: auto-merge is for dev patches only).
#
# A merge made by GITHUB_TOKEN doesn't start a new workflow run, so these
# merges don't deploy on their own; the next merge to main deploys them.

'on': pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'nickmagruder/crashmap'
    permissions:
      contents: write # merge
      pull-requests: write # enable auto-merge
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for devDependency patches
        env:
          DEPS: ${{ steps.meta.outputs.updated-dependencies-json }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          eligible=$(node -e '
            const deps = JSON.parse(process.env.DEPS || "[]");
            const ok = deps.length > 0 && deps.every(
              (d) => d.updateType === "version-update:semver-patch" && d.dependencyType === "direct:development");
            process.stdout.write(ok ? "yes" : "no");
          ')
          if [ "$eligible" = "yes" ]; then
            gh pr merge --auto --squash "$PR_URL"
          else
            echo "Not a devDependency-only patch update; leaving it for review."
          fi
